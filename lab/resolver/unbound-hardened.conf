# Part 3 — DNSSEC-validating configuration for Unbound.
#
# Identical to unbound-vulnerable.conf for source-port pinning and the
# black-hole forward-zone (so the wire-level attack flow is unchanged
# from Part 1), but with the validator module loaded and a trust anchor
# configured for `target.lab`. The same spoofs that worked in Part 1
# are now rejected as BOGUS because they carry no RRSIG.
server:
  verbosity: 1
  interface: 192.168.56.20
  port: 53
  access-control: 192.168.56.0/24 allow
  do-not-query-localhost: no

  # Source-port pinning kept in place, to demonstrate that the network
  # layer is still as weak as it was in Part 1 — DNSSEC alone defeats
  # the attack.
  use-caps-for-id: no
  outgoing-range: 1
  outgoing-port-avoid: "0-65535"
  outgoing-port-permit: "33333"
  qname-minimisation: no

  cache-min-ttl: 60
  cache-max-ttl: 86400

  # PART 3 — re-enable validator + trust anchor for target.lab.
  module-config: "validator iterator"
  trust-anchor-file: "/etc/unbound/keys/target.lab.key"
  # The IANA root trust anchor (auto-managed by unbound) is loaded
  # automatically from /var/lib/unbound/root.key; this is set up by
  # the unbound package install on Ubuntu.

  logfile: "/var/log/unbound/unbound.log"
  log-queries: yes
  log-replies: yes
  log-tag-queryreply: yes
  val-log-level: 2

forward-zone:
  name: "target.lab."
  forward-addr: 192.168.56.99
